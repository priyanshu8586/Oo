name: Build Debug APK and Publish Release

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify active Java version
        run: java -version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Verify Gradle version
        run: gradle --version

      - name: Create temporary debug keystore
        run: |
          rm -f debug.keystore
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK exists
        run: |
          if [ ! -s "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "::error::Expected debug APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK Actions artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset and metadata
        id: prepare_release
        run: |
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_FILENAME="app-debug-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}.apk"
          ASSET_PATH="${RUNNER_TEMP}/${ASSET_FILENAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"
          if [ ! -s "${ASSET_PATH}" ]; then
            echo "::error::Prepared release APK is missing or empty."
            exit 1
          fi

          printf '%s\n' \
            "- This is an automatically generated debug APK." \
            "- The APK was built by GitHub Actions." \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- This APK is intended for testing only." \
            "- This APK is not a Play Store production release." \
            "- This APK is signed only with a temporary debug keystore." \
            > "${RUNNER_TEMP}/release-notes.md"

          echo "release_tag=${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"
          echo "release_title=${RELEASE_TITLE}" >> "${GITHUB_OUTPUT}"
          echo "asset_filename=${ASSET_FILENAME}" >> "${GITHUB_OUTPUT}"
          echo "asset_path=${ASSET_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.prepare_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release.outputs.release_title }}
          ASSET_PATH: ${{ steps.prepare_release.outputs.asset_path }}
        run: |
          gh release create "${RELEASE_TAG}" \
            "${ASSET_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${RELEASE_TITLE}" \
            --target "${GITHUB_SHA}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build_apk.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload_artifact.outcome }}
          RELEASE_OUTCOME: ${{ steps.publish_release.outcome }}
          RELEASE_TAG: ${{ steps.prepare_release.outputs.release_tag }}
          RELEASE_TITLE: ${{ steps.prepare_release.outputs.release_title }}
          ASSET_FILENAME: ${{ steps.prepare_release.outputs.asset_filename }}
        run: |
          if [ "${BUILD_OUTCOME}" != "success" ] || [ "${UPLOAD_OUTCOME}" != "success" ]; then
            echo "::warning::APK build or Actions artifact upload did not complete successfully."
            {
              echo "### APK Build Status"
              echo "- Build outcome: \`${BUILD_OUTCOME}\`"
              echo "- Artifact upload outcome: \`${UPLOAD_OUTCOME}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [ "${RELEASE_OUTCOME}" = "success" ]; then
            RELEASE_URL=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')
            CONFIRMED_TAG=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')
            CONFIRMED_TITLE=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json name --jq '.name')
            CONFIRMED_ASSET=$(gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets[0].name')

            echo "Release Tag: ${CONFIRMED_TAG}"
            echo "Release Title: ${CONFIRMED_TITLE}"
            echo "Release Page URL: ${RELEASE_URL}"
            echo "APK Asset Filename: ${CONFIRMED_ASSET}"

            {
              echo "### Debug APK Build & Release Summary"
              echo "- **APK Build:** Succeeded (\`app/build/outputs/apk/debug/app-debug.apk\`)"
              echo "- **Actions Artifact Backup:** \`app-debug-apk\` uploaded successfully"
              echo "- **Release Tag:** \`${CONFIRMED_TAG}\`"
              echo "- **Release Title:** ${CONFIRMED_TITLE}"
              echo "- **Release URL:** ${RELEASE_URL}"
              echo "- **APK Asset Filename:** \`${CONFIRMED_ASSET}\`"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above. The normal Actions artifact (\`app-debug-apk\`) is also available as a backup."
            } >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::GitHub Release publishing failed, but the APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Summary (Release Warning)"
              echo "> **Warning:** GitHub Release publishing failed, so no release URL is available."
              echo ""
              echo "- **APK Build:** Succeeded"
              echo "- **Actions Artifact Backup:** \`app-debug-apk\` remains available for download in this workflow run's **Artifacts** section."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Clean up temporary debug keystore
        if: always()
        run: rm -f debug.keystore
